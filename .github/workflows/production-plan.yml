name: Production infrastructure plan

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/production-plan.yml
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-infrastructure-plan
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: render-operations
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_ONLY_API_TOKEN }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::713285551626:role/orbit-production-plan
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Inspect production without applying or publishing state
        env:
          PRODUCTION_PLAN_TFVARS: ${{ secrets.PRODUCTION_PLAN_TFVARS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plan_dir=$(mktemp -d)
          trap 'rm -rf "$plan_dir" infra/.terraform' EXIT
          test -n "$RENDER_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PRODUCTION_PLAN_TFVARS"
          printf '%s' "$PRODUCTION_PLAN_TFVARS" > "$plan_dir/inputs.tfvars.json"
          if ! terraform -chdir=infra init -input=false -no-color > "$plan_dir/init.log" 2>&1; then
            echo '::error::Production plan initialization failed; verify the read-only role and state access'
            exit 1
          fi
          if ! terraform -chdir=infra plan -input=false -lock=false -no-color \
            -var-file="$plan_dir/inputs.tfvars.json" -out="$plan_dir/production.plan" \
            -target=render_web_service.production_api \
            -target=render_web_service.production_web \
            -target=render_env_group.production_api > "$plan_dir/plan.log" 2>&1; then
            echo '::error::Production plan failed; verify scoped provider reads and reviewed input values'
            exit 1
          fi
          terraform -chdir=infra show -json "$plan_dir/production.plan" | node infra/check-web-plan.mjs
          terraform -chdir=infra show -json "$plan_dir/production.plan" | node infra/check-production-plan.mjs
          echo 'Production plan contains no guarded changes or drift.' >> "$GITHUB_STEP_SUMMARY"
