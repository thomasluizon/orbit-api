# Required repository secret: RENDER_API_KEY from Render Account Settings > API Keys.
# Required repository variable: RENDER_PRODUCTION_SERVICE_ID for the production orbit-api web service.
name: Deploy API

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit to deploy
        required: true
        default: main

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 170
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_PRODUCTION_SERVICE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger and monitor Render deploy
        id: render
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          payload=$(jq -cn --arg sha "$COMMIT_SHA" '{commitId: $sha}')
          triggered_after=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          response_file=$(mktemp)
          http_status=$(curl --fail-with-body --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$payload")
          # Render answers 201 with the created deploy, or 202 Queued with no body; a queued deploy is found by its commit.
          case "$http_status" in
            201) deploy_id=$(jq -er '.id' < "$response_file") ;;
            202)
              deploy_id=
              for attempt in {1..30}; do
                deploy_id=$(curl --fail-with-body --silent --show-error --get \
                  "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
                  --header "Authorization: Bearer $RENDER_API_KEY" \
                  --data-urlencode 'limit=20' --data-urlencode "createdAfter=$triggered_after" |
                  jq -r --arg sha "$COMMIT_SHA" '[.[] | select(.deploy.commit.id == $sha) | .deploy.id][0] // empty')
                if [ -n "$deploy_id" ]; then break; fi
                sleep 2
              done
              if [ -z "$deploy_id" ]; then
                echo "::error::Render queued a deploy of $COMMIT_SHA but did not list it"
                exit 1
              fi ;;
            *)
              echo "::error::Render answered HTTP $http_status to the deploy request"
              exit 1 ;;
          esac
          log_url="https://dashboard.render.com/web/$RENDER_SERVICE_ID/deploys/$deploy_id"
          echo "log_url=$log_url" >> "$GITHUB_OUTPUT"
          echo "Render deploy: $log_url"

          for attempt in {1..640}; do
            response=$(curl --fail-with-body --silent --show-error \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              --header "Authorization: Bearer $RENDER_API_KEY")
            status=$(jq -er '.status' <<< "$response")
            echo "Render deploy status: $status (poll $attempt)"
            case "$status" in
              live) exit 0 ;;
              build_failed|pre_deploy_failed|update_failed|canceled|deactivated)
                echo "::error::Render deploy $deploy_id ended with $status. Logs: $log_url"
                exit 1 ;;
              created|queued|build_in_progress|pre_deploy_in_progress|update_in_progress)
                sleep 15 ;;
              *)
                echo "::error::Render deploy $deploy_id returned unknown status $status. Logs: $log_url"
                exit 1 ;;
            esac
          done
          echo "::error::Render deploy $deploy_id timed out. Logs: $log_url"
          exit 1

      - name: Verify production health
        run: |
          set -euo pipefail
          health=$(curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 \
            https://api.useorbit.org/health)
          jq -e '.status == "Healthy"' <<< "$health"

      - name: Record production deployment
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          RENDER_LOG_URL: ${{ steps.render.outputs.log_url }}
        run: |
          set -euo pipefail
          # Another Render trigger can replace this release after it went live; record success only for the commit live now.
          live_commit=$(curl --fail-with-body --silent --show-error --get \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --data-urlencode 'status=live' --data-urlencode 'limit=1' |
            jq -er '.[0].deploy.commit.id')
          if [ "$live_commit" != "$COMMIT_SHA" ]; then
            echo "::error::Render now serves $live_commit, not the released $COMMIT_SHA"
            exit 1
          fi
          deployment=$(jq -cn --arg ref "$COMMIT_SHA" \
            '{ref: $ref, environment: "production", auto_merge: false, required_contexts: []}')
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            --input - --jq '.id' <<< "$deployment")
          status=$(jq -cn --arg log_url "$RENDER_LOG_URL" \
            '{state: "success", environment: "production", log_url: $log_url, environment_url: "https://api.useorbit.org"}')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            --input - <<< "$status"
