name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/terraform.yml
      - .github/workflows/staging-reseed.yml
      - .github/workflows/staging-postgres-access-reconcile.yml
      - .github/workflows/release.yml
      - .github/scripts/staging-reseed*
      - .github/scripts/*staging-postgres-access*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Render infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: npm ci --prefix infra --ignore-scripts
      - run: npm test --prefix infra
      - run: node --test .github/scripts/staging-reseed.test.mjs .github/scripts/staging-reseed-image.test.mjs
      - run: bash .github/scripts/test-staging-postgres-access.sh
