name: PR Text

# The pull request title, body and commit messages. It runs on a body edit too, and it is a
# separate workflow so that an edit never posts a new Guards check run on the head.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# A newer event of the same pull request reads the same live head, title and body.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-text:
    name: PR Text
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash
    steps:
      # The attribution check reads every commit of the pull request range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dash Ban
        if: ${{ !cancelled() && github.event.pull_request.user.type != 'Bot' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/check-dashes.mjs --text "$PR_TITLE $PR_BODY"

      - name: Attribution Lines
        if: ${{ !cancelled() }}
        env:
          PULL_REQUEST_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request-body.md"
          node tools/check-attribution.mjs --range "$PULL_REQUEST_RANGE" --body-file "$RUNNER_TEMP/pull-request-body.md"
