name: CodeQL

# The job name is load bearing: each matrix leg reports "Analyze (<language>)", which
# the required checks name. Never rename the job or a language value.
# A leg skips its steps, never the job, so the check context always exists.
# C# builds Orbit.Api for real, because the build generates code that buildless extraction misses.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp", "actions"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select the inputs that changed
        id: inputs
        env:
          LANGUAGE: ${{ matrix.language }}
        run: bash .github/scripts/changed-inputs.sh "$LANGUAGE"

      - name: Setup .NET
        if: matrix.language == 'csharp' && steps.inputs.outputs.csharp == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore the NuGet package cache
        if: matrix.language == 'csharp' && steps.inputs.outputs.csharp == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'Directory.Build.props', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Initialize CodeQL
        if: steps.inputs.outputs[matrix.language] != 'false'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}

      - name: Build
        if: matrix.language == 'csharp' && steps.inputs.outputs.csharp == 'true'
        run: |
          dotnet restore src/Orbit.Api/Orbit.Api.csproj
          dotnet build src/Orbit.Api/Orbit.Api.csproj --no-restore

      - name: Perform CodeQL Analysis
        if: steps.inputs.outputs[matrix.language] != 'false'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
