name: Staging reseed

# Required secret: RENDER_API_KEY in the render-operations environment.
# Required variable: SEED_OWNER_EMAIL for the staging owner's Google sign-in email.
# Required variables: STAGING_ENVIRONMENT_ID and STAGING_API_SERVICE_ID from GitHub Settings > Secrets and variables > Actions > Variables.
# The AWS role is created by infra/github_oidc.tf before this workflow is enabled.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-release-staging
  cancel-in-progress: false
  queue: max

jobs:
  reseed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: render-operations
    timeout-minutes: 60
    env:
      BASH_ENV: ${{ github.workspace }}/.github/scripts/staging-reseed-errors.sh
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_staging_environment_id: ${{ vars.STAGING_ENVIRONMENT_ID }}
      TF_VAR_staging_api_service_id: ${{ vars.STAGING_API_SERVICE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::713285551626:role/orbit-staging-reseed
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Initialize staging database state
        env:
          STAGING_RESEED_STEP: Initialize staging database state
        run: |
          [[ -n "$TF_VAR_staging_environment_id" && -n "$TF_VAR_staging_api_service_id" ]]
          terraform -chdir=infra/staging-database init -input=false
      - name: Read staging database age
        id: age
        env:
          STAGING_RESEED_STEP: Read staging database age
        run: |
          database_id="$(terraform -chdir=infra/staging-database output -raw staging_postgres_id)"
          echo "database_id=${database_id}" >> "$GITHUB_OUTPUT"
          created_at="$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/postgres/${database_id}" \
            | jq --exit-status --raw-output --arg id "${database_id}" 'select(.id == $id) | .createdAt')"
          age_seconds="$(python3 -c 'from datetime import datetime, timezone; import sys; print(int((datetime.now(timezone.utc) - datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))).total_seconds()))' "${created_at}")"
          if [[ "${{ github.event_name }}" == workflow_dispatch || "${age_seconds}" -ge 2246400 ]]; then
            echo 'replace=true' >> "$GITHUB_OUTPUT"
          else
            echo 'replace=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install PostgreSQL 17 client tools
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Install PostgreSQL 17 client tools
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc --output "$RUNNER_TEMP/postgresql.asc"
          sudo install --mode=644 "$RUNNER_TEMP/postgresql.asc" /usr/share/keyrings/postgresql.asc
          echo 'deb [signed-by=/usr/share/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Allow runner access for the data backup
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Allow runner access for the data backup
          STAGING_POSTGRES_ID: ${{ steps.age.outputs.database_id }}
          STAGING_ACCESS_MARKER: ${{ runner.temp }}/staging-backup-access
        run: bash .github/scripts/staging-postgres-access.sh open
      - name: Back up staging data
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Back up staging data
          STAGING_CARRY_DIRECTORY: ${{ runner.temp }}/staging-data-carry
        run: |
          STAGING_DATABASE_URL="$(terraform -chdir=infra/staging-database output -raw staging_external_connection_string)"
          export STAGING_DATABASE_URL
          python3 .github/scripts/staging-reseed-data.py backup
      - name: Restore operator access after the data backup
        if: always() && steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Restore operator access after the data backup
          STAGING_POSTGRES_ID: ${{ steps.age.outputs.database_id }}
          STAGING_ACCESS_MARKER: ${{ runner.temp }}/staging-backup-access
        run: bash .github/scripts/staging-postgres-access.sh restore
      - name: Replace staging database and refresh its API connection
        id: replace
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Replace staging database and refresh its API connection
        run: |
          terraform -chdir=infra/staging-database plan -input=false \
            -replace=render_postgres.staging \
            -target=render_postgres.staging \
            -target=render_env_group.staging_database \
            -out=staging-reseed.tfplan > /dev/null
          plan_json="$(terraform -chdir=infra/staging-database show -json staging-reseed.tfplan)"
          jq --exit-status '
            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes |
            if ($changes | (length >= 1 and all(.[]; .address == "render_postgres.staging" or
              (.address == "render_env_group.staging_database" and .change.actions == ["update"]))) and
            any(.[]; .address == "render_postgres.staging" and
              (.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])))
            then true
            else error("Rejected staging reseed plan: " +
              ($changes | map({address, actions: .change.actions}) | tojson))
            end
          ' <<< "$plan_json" > /dev/null
          terraform -chdir=infra/staging-database apply -input=false -auto-approve staging-reseed.tfplan > /dev/null
          database_id="$(terraform -chdir=infra/staging-database output -raw staging_postgres_id)"
          echo "database_id=${database_id}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.age.outputs.replace == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Allow runner access for migrations
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Allow runner access for migrations
          STAGING_POSTGRES_ID: ${{ steps.replace.outputs.database_id }}
          STAGING_ACCESS_MARKER: ${{ runner.temp }}/staging-migration-access
        run: bash .github/scripts/staging-postgres-access.sh open
      - name: Restore and verify staging data
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Restore and verify staging data
          STAGING_CARRY_DIRECTORY: ${{ runner.temp }}/staging-data-carry
        run: |
          STAGING_DATABASE_URL="$(terraform -chdir=infra/staging-database output -raw staging_external_connection_string)"
          export STAGING_DATABASE_URL
          python3 .github/scripts/staging-reseed-data.py restore
      - name: Apply migrations to the replacement database
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Apply migrations to the replacement database
          ASPNETCORE_ENVIRONMENT: Staging
          Seed__OwnerEmail: ${{ vars.SEED_OWNER_EMAIL }}
        run: |
          Seed__ExpectedHost="$(terraform -chdir=infra/staging-database output -raw staging_external_host)"
          Seed__DatabaseUrl="$(terraform -chdir=infra/staging-database output -raw staging_external_connection_string)"
          export Seed__ExpectedHost Seed__DatabaseUrl
          dotnet run --project src/Orbit.Api/Orbit.Api.csproj --no-launch-profile -- migrate-staging
      - name: Restore operator access after migrations
        id: migration_cleanup
        if: always() && steps.replace.outputs.database_id != ''
        env:
          STAGING_RESEED_STEP: Restore operator access after migrations
          STAGING_POSTGRES_ID: ${{ steps.replace.outputs.database_id }}
          STAGING_ACCESS_MARKER: ${{ runner.temp }}/staging-migration-access
        run: bash .github/scripts/staging-postgres-access.sh restore
      - name: Deploy the staging API and wait for that deploy
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Deploy the staging API and wait for that deploy
        run: |
          image_url="$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --get --data-urlencode 'status=live' --data-urlencode 'limit=1' \
            "https://api.render.com/v1/services/${TF_VAR_staging_api_service_id}/deploys" \
            | jq --exit-status --raw-output '.[0].deploy.image.ref | select(type == "string" and length > 0)')"
          if [[ ! "$image_url" =~ ^ghcr\.io/thomasluizon/orbit-api@sha256:[a-f0-9]{64}$ ]]; then
            echo 'Staging reseed requires a live API image pinned by digest' >&2
            exit 1
          fi
          payload="$(jq --null-input --compact-output --arg image "$image_url" '{imageUrl: $image}')"
          response="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header 'Content-Type: application/json' --data "$payload" \
            "https://api.render.com/v1/services/${TF_VAR_staging_api_service_id}/deploys")"
          if [[ "$status" != 201 ]]; then
            echo "Render image deploy request answered HTTP ${status}; check service deploys before rerunning" >&2
            exit 1
          fi
          deploy_id="$(jq --exit-status --raw-output --arg image "$image_url" \
            'select(.image.ref == $image) | .id | select(type == "string" and length > 0)' "$response")"
          for ((attempt=1; attempt<=90; attempt++)); do
            deploy_status="$(curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${TF_VAR_staging_api_service_id}/deploys/${deploy_id}" \
              | jq --exit-status --raw-output --arg id "$deploy_id" 'select(.id == $id) | .status')"
            case "$deploy_status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deploy ${deploy_id} ended with status ${deploy_status}" >&2
                exit 1
                ;;
              created|queued|build_in_progress|pre_deploy_in_progress|update_in_progress) ;;
              *)
                echo "Render deploy ${deploy_id} returned unknown status ${deploy_status}" >&2
                exit 1 ;;
            esac
            sleep 20
          done
          echo "Render deploy ${deploy_id} did not become live before the wait expired" >&2
          exit 1
      - name: Allow runner access for the owner seed
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Allow runner access for the owner seed
          STAGING_POSTGRES_ID: ${{ steps.replace.outputs.database_id }}
          STAGING_ACCESS_MARKER: ${{ runner.temp }}/staging-seed-access
        run: bash .github/scripts/staging-postgres-access.sh open
      - name: Seed the owner account
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_RESEED_STEP: Seed the owner account
          ASPNETCORE_ENVIRONMENT: Staging
          Seed__OwnerEmail: ${{ vars.SEED_OWNER_EMAIL }}
        run: |
          Seed__ExpectedHost="$(terraform -chdir=infra/staging-database output -raw staging_external_host)"
          Seed__DatabaseUrl="$(terraform -chdir=infra/staging-database output -raw staging_external_connection_string)"
          export Seed__ExpectedHost Seed__DatabaseUrl
          dotnet run --project src/Orbit.Api/Orbit.Api.csproj --no-launch-profile -- seed-staging
      - name: Restore operator access after the owner seed
        if: always() && steps.replace.outputs.database_id != ''
        env:
          STAGING_RESEED_STEP: Restore operator access after the owner seed
          STAGING_POSTGRES_ID: ${{ steps.replace.outputs.database_id }}
          STAGING_ACCESS_MARKER: ${{ runner.temp }}/staging-seed-access
        run: bash .github/scripts/staging-postgres-access.sh restore
      - name: Delete local staging data
        if: always()
        env:
          STAGING_RESEED_STEP: Delete local staging data
          STAGING_CARRY_DIRECTORY: ${{ runner.temp }}/staging-data-carry
        run: rm -rf -- "$STAGING_CARRY_DIRECTORY"
