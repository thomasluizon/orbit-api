name: Staging reseed

# Required secret: RENDER_API_KEY from Render Account Settings > API Keys.
# Required variable: SEED_OWNER_EMAIL for the staging owner's Google sign-in email.
# Required variables: STAGING_ENVIRONMENT_ID and STAGING_API_SERVICE_ID from GitHub Settings > Secrets and variables > Actions > Variables.
# The AWS role is created by infra/github_oidc.tf before this workflow is enabled.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      allowlist_probe:
        description: Test temporary runner access on the current staging database
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-release-staging
  cancel-in-progress: false

jobs:
  reseed:
    if: github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/fix/ticket-826-reseed-allowlist' && inputs.allowlist_probe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_staging_environment_id: ${{ vars.STAGING_ENVIRONMENT_ID }}
      TF_VAR_staging_api_service_id: ${{ vars.STAGING_API_SERVICE_ID }}
      TF_VAR_staging_postgres_ip_allow_list: ${{ vars.STAGING_POSTGRES_IP_ALLOW_LIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe temporary runner access
        if: inputs.allowlist_probe
        env:
          STAGING_POSTGRES_ID: dpg-dasotg8jo6nc73cok6g0-a
        run: bash .github/scripts/staging-postgres-access.sh open
      - name: Inspect staging connection fields for the probe
        if: inputs.allowlist_probe
        run: |
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            'https://api.render.com/v1/postgres/dpg-dasotg8jo6nc73cok6g0-a/connection-info')"
          jq 'keys' <<< "$response"
      - name: Restore operator access after the probe
        if: always() && inputs.allowlist_probe
        env:
          STAGING_POSTGRES_ID: dpg-dasotg8jo6nc73cok6g0-a
        run: bash .github/scripts/staging-postgres-access.sh restore
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        if: ${{ !inputs.allowlist_probe }}
        with:
          role-to-assume: arn:aws:iam::713285551626:role/orbit-staging-reseed
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: ${{ !inputs.allowlist_probe }}
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Initialize staging database state
        if: ${{ !inputs.allowlist_probe }}
        run: |
          [[ -n "$TF_VAR_staging_environment_id" && -n "$TF_VAR_staging_api_service_id" ]]
          jq --exit-status 'type == "array" and all(.[];
            (.cidr_block | type == "string" and length > 0) and
            (.description | type == "string"))' <<< "$TF_VAR_staging_postgres_ip_allow_list"
          terraform -chdir=infra/staging-database init -input=false
      - name: Read staging database age
        id: age
        if: ${{ !inputs.allowlist_probe }}
        run: |
          database_id="$(terraform -chdir=infra/staging-database output -raw staging_postgres_id)"
          created_at="$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/postgres/${database_id}" \
            | jq --exit-status --raw-output --arg id "${database_id}" 'select(.id == $id) | .createdAt')"
          age_seconds="$(python3 -c 'from datetime import datetime, timezone; import sys; print(int((datetime.now(timezone.utc) - datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))).total_seconds()))' "${created_at}")"
          if [[ "${{ github.event_name }}" == workflow_dispatch || "${age_seconds}" -ge 2246400 ]]; then
            echo 'replace=true' >> "$GITHUB_OUTPUT"
          else
            echo 'replace=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Replace staging database and refresh its API connection
        id: replace
        if: steps.age.outputs.replace == 'true'
        run: |
          terraform -chdir=infra/staging-database plan -input=false \
            -replace=render_postgres.staging \
            -out=staging-reseed.tfplan > /dev/null
          terraform -chdir=infra/staging-database show -json staging-reseed.tfplan | jq --exit-status '
            [.resource_changes[] | select(.change.actions != ["no-op"])] |
            (length >= 1 and all(.[]; .address == "render_postgres.staging" or
              (.address == "render_env_group.staging_database" and .change.actions == ["update"]))) and
            any(.[]; .address == "render_postgres.staging" and
              (.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"]))
          ' > /dev/null
          terraform -chdir=infra/staging-database apply -input=false -auto-approve staging-reseed.tfplan > /dev/null
          echo "database_id=$(terraform -chdir=infra/staging-database output -raw staging_postgres_id)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.age.outputs.replace == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Allow runner access for migrations
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_POSTGRES_ID: ${{ steps.replace.outputs.database_id }}
        run: bash .github/scripts/staging-postgres-access.sh open
      - name: Apply migrations to the replacement database
        if: steps.age.outputs.replace == 'true'
        env:
          ASPNETCORE_ENVIRONMENT: Staging
          Seed__OwnerEmail: ${{ vars.SEED_OWNER_EMAIL }}
        run: |
          Seed__ExpectedHost="$(terraform -chdir=infra/staging-database output -raw staging_external_host)" \
            Seed__DatabaseUrl="$(terraform -chdir=infra/staging-database output -raw staging_external_connection_string)" \
            dotnet run --project src/Orbit.Api/Orbit.Api.csproj -- migrate-staging
      - name: Restore operator access after migrations
        id: migration_cleanup
        if: always() && steps.replace.outputs.database_id != ''
        env:
          STAGING_POSTGRES_ID: ${{ steps.replace.outputs.database_id }}
        run: bash .github/scripts/staging-postgres-access.sh restore
      - name: Deploy the staging API and wait for that deploy
        if: steps.age.outputs.replace == 'true'
        run: |
          set -euo pipefail
          commit_id="$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --get --data-urlencode 'status=live' --data-urlencode 'limit=1' \
            "https://api.render.com/v1/services/${TF_VAR_staging_api_service_id}/deploys" \
            | jq --exit-status --raw-output '.[0].deploy.commit.id | select(type == "string" and length > 0)')"
          payload="$(jq --null-input --compact-output --arg commit "$commit_id" '{commitId: $commit}')"
          triggered_after="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          response="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header 'Content-Type: application/json' --data "$payload" \
            "https://api.render.com/v1/services/${TF_VAR_staging_api_service_id}/deploys")"
          if [[ "$status" == 201 ]]; then
            deploy_id="$(jq --exit-status --raw-output '.id | select(type == "string" and length > 0)' "$response")"
          elif [[ "$status" == 202 ]]; then
            deploy_id=''
            for ((attempt=1; attempt<=30; attempt++)); do
              candidates="$(curl --fail --silent --show-error --max-time 30 \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                --get --data-urlencode "createdAfter=${triggered_after}" \
                --data-urlencode 'limit=100' \
                "https://api.render.com/v1/services/${TF_VAR_staging_api_service_id}/deploys" \
                | jq --compact-output --arg commit "$commit_id" \
                  '[.[] | select(.deploy.commit.id == $commit) | .deploy.id]')"
              candidate_count="$(jq 'length' <<< "$candidates")"
              if ((candidate_count > 1)); then
                echo "Multiple deploys of ${commit_id} appeared after the trigger; cannot identify the requested deploy" >&2
                exit 1
              fi
              if ((candidate_count == 1)); then
                deploy_id="$(jq --raw-output '.[0]' <<< "$candidates")"
                break
              fi
              sleep 10
            done
            if [[ -z "$deploy_id" ]]; then
              echo "Render queued a deploy of ${commit_id} but did not list it" >&2
              exit 1
            fi
          else
            echo "Render deploy request failed with HTTP ${status}" >&2
            exit 1
          fi
          for ((attempt=1; attempt<=90; attempt++)); do
            deploy_status="$(curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${TF_VAR_staging_api_service_id}/deploys/${deploy_id}" \
              | jq --exit-status --raw-output --arg id "$deploy_id" 'select(.id == $id) | .status')"
            case "$deploy_status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 20
          done
          exit 1
      - name: Allow runner access for the owner seed
        if: steps.age.outputs.replace == 'true'
        env:
          STAGING_POSTGRES_ID: ${{ steps.replace.outputs.database_id }}
        run: bash .github/scripts/staging-postgres-access.sh open
      - name: Seed the owner account
        if: steps.age.outputs.replace == 'true'
        env:
          ASPNETCORE_ENVIRONMENT: Staging
          Seed__OwnerEmail: ${{ vars.SEED_OWNER_EMAIL }}
        run: |
          Seed__ExpectedHost="$(terraform -chdir=infra/staging-database output -raw staging_external_host)" \
            Seed__DatabaseUrl="$(terraform -chdir=infra/staging-database output -raw staging_external_connection_string)" \
            dotnet run --project src/Orbit.Api/Orbit.Api.csproj -- seed-staging
      - name: Restore operator access after the owner seed
        if: always() && steps.replace.outputs.database_id != ''
        env:
          STAGING_POSTGRES_ID: ${{ steps.replace.outputs.database_id }}
        run: bash .github/scripts/staging-postgres-access.sh restore
