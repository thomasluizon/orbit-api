name: Mutation Testing

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_ROLL_FORWARD: Major

permissions:
  contents: read

jobs:
  changes:
    name: Select mutation shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-shards: ${{ steps.select.outputs.has-shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup .NET for span selection
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Test shard selection
        run: node --test .github/scripts/mutation-matrix.test.mjs
      - name: Select changed projects
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            since_target=$(git rev-parse HEAD^1)
            node .github/scripts/mutation-matrix.mjs --since "$since_target" >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/mutation-matrix.mjs >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Mutation (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.has-shards == 'true'
    runs-on: ubuntu-latest
    # https://github.com/stryker-mutator/stryker-net/blob/f9109e24c615a7030a3b33e5532c665c974e4ec5/src/Stryker.TestRunner.VsTest/VsTestContextInformation.cs#L288-L322
    # https://github.com/thomasluizon/orbit-api/actions/runs/42415985803
    # Before the mutate filter applies, Stryker runs every test in two serial sessions: the initial run and the coverage run.
    # Each infrastructure shard used 21 to 32 minutes before its first mutant test, so 45 minutes left too little time for the mutant phase.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Restore local tools
        run: dotnet tool restore

      # https://github.com/stryker-mutator/stryker-net/blob/f9109e24c615a7030a3b33e5532c665c974e4ec5/docs/configuration.md#test-projects-string
      # Stryker honors test-projects only from the project under test; the root Orbit.slnx starts solution mode and runs every test project.
      - name: Run Stryker (PR changed in-scope files only)
        if: github.event_name == 'pull_request'
        env:
          MUTATE_FILES: ${{ join(matrix.mutate, ' ') }}
          MUTATION_PROJECT: ${{ matrix.project }}
        run: |
          since_target=$(git rev-parse HEAD^1)
          concurrency=$(nproc)
          echo "Stryker concurrency: $concurrency"
          read -r -a files <<< "$MUTATE_FILES"
          args=()
          for file in "${files[@]}"; do
            args+=(--mutate "$file")
          done
          config="stryker-config.$MUTATION_PROJECT.json"
          project_file=$(jq -er '."stryker-config".project' "$config")
          cd "src/${project_file%.csproj}"
          dotnet stryker -f "../../$config" --since:"$since_target" --concurrency "$concurrency" "${args[@]}"

      - name: Run Stryker (nightly full in-scope)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          MUTATE_FILES: ${{ join(matrix.mutate, ' ') }}
          MUTATION_PROJECT: ${{ matrix.project }}
        run: |
          concurrency=$(nproc)
          echo "Stryker concurrency: $concurrency"
          read -r -a files <<< "$MUTATE_FILES"
          args=()
          for file in "${files[@]}"; do
            args+=(--mutate "$file")
          done
          config="stryker-config.$MUTATION_PROJECT.json"
          project_file=$(jq -er '."stryker-config".project' "$config")
          cd "src/${project_file%.csproj}"
          dotnet stryker -f "../../$config" --concurrency "$concurrency" "${args[@]}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.event_name }}-${{ matrix.shard }}
          path: |
            src/Orbit.*/StrykerOutput/**/reports/*.html
            src/Orbit.*/StrykerOutput/**/reports/*.json
          if-no-files-found: ignore
