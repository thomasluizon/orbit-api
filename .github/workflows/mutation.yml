name: Mutation Testing

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_ROLL_FORWARD: Major

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (${{ matrix.shard || matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: domain
            shard: domain-habit-freeze
            mutate: ["**/Entities/Habit.cs", "**/Entities/StreakFreeze.cs"]
          - project: domain
            shard: domain-user-invariants
            mutate: ["**/Entities/User.cs", "**/Entities/HabitInvariants.cs"]
          - project: application
          - project: infrastructure

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run Stryker (PR changed in-scope files only)
        if: github.event_name == 'pull_request'
        env:
          MUTATE_FILES: ${{ matrix.mutate && join(matrix.mutate, ' ') || '' }}
        run: |
          git fetch origin main
          concurrency=$(nproc)
          echo "Stryker concurrency: $concurrency"
          read -r -a files <<< "$MUTATE_FILES"
          args=()
          for file in "${files[@]}"; do
            args+=(--mutate "$file")
          done
          dotnet stryker -f stryker-config.${{ matrix.project }}.json --since:origin/main --concurrency "$concurrency" "${args[@]}"

      - name: Run Stryker (nightly full in-scope)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          MUTATE_FILES: ${{ matrix.mutate && join(matrix.mutate, ' ') || '' }}
        run: |
          concurrency=$(nproc)
          echo "Stryker concurrency: $concurrency"
          read -r -a files <<< "$MUTATE_FILES"
          args=()
          for file in "${files[@]}"; do
            args+=(--mutate "$file")
          done
          dotnet stryker -f stryker-config.${{ matrix.project }}.json --concurrency "$concurrency" "${args[@]}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.event_name }}-${{ matrix.shard || matrix.project }}
          path: |
            StrykerOutput/**/reports/*.html
            StrykerOutput/**/reports/*.json
          if-no-files-found: ignore
