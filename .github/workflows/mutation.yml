name: Mutation Testing

on:
  pull_request:
    branches: [main, redesign/main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_ROLL_FORWARD: Major

permissions:
  contents: read

jobs:
  changes:
    name: Select mutation shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-shards: ${{ steps.select.outputs.has-shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test shard selection
        run: node --test .github/scripts/mutation-matrix.test.mjs
      - name: Select changed projects
        id: select
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          set -o pipefail
          if [ -n "$BASE_REF" ]; then
            git diff --name-only --no-renames -z --end-of-options "$BASE_REF...HEAD" \
              | node .github/scripts/mutation-matrix.mjs --stdin >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/mutation-matrix.mjs >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Mutation (${{ matrix.shard || matrix.project }})
    needs: changes
    if: needs.changes.outputs.has-shards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run Stryker (PR changed in-scope files only)
        if: github.event_name == 'pull_request'
        env:
          MUTATE_FILES: ${{ matrix.mutate && join(matrix.mutate, ' ') || '' }}
        run: |
          since_target=$(git rev-parse HEAD^1)
          concurrency=$(nproc)
          echo "Stryker concurrency: $concurrency"
          read -r -a files <<< "$MUTATE_FILES"
          args=()
          for file in "${files[@]}"; do
            args+=(--mutate "$file")
          done
          dotnet stryker -f stryker-config.${{ matrix.project }}.json --since:"$since_target" --concurrency "$concurrency" "${args[@]}"

      - name: Run Stryker (nightly full in-scope)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          MUTATE_FILES: ${{ matrix.mutate && join(matrix.mutate, ' ') || '' }}
        run: |
          concurrency=$(nproc)
          echo "Stryker concurrency: $concurrency"
          read -r -a files <<< "$MUTATE_FILES"
          args=()
          for file in "${files[@]}"; do
            args+=(--mutate "$file")
          done
          dotnet stryker -f stryker-config.${{ matrix.project }}.json --concurrency "$concurrency" "${args[@]}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.event_name }}-${{ matrix.shard || matrix.project }}
          path: |
            StrykerOutput/**/reports/*.html
            StrykerOutput/**/reports/*.json
          if-no-files-found: ignore
