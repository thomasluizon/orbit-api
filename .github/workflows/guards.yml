name: Guards

# These repository gates apply to every contributor through CI.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Workflow Syntax
        if: ${{ !cancelled() }}
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency documents queue, which actionlint does not recognize.
        run: |
          lint_dir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash -o "$lint_dir/download-actionlint.bash"
          bash "$lint_dir/download-actionlint.bash" 1.7.12 "$lint_dir"
          "$lint_dir/actionlint" -color -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'

      - name: Timeless Text
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node tools/check-timeless.mjs --base "origin/$BASE_REF"
          else
            node tools/check-timeless.mjs --all
          fi

      - name: Dash Ban
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -z \
              | xargs -0 --no-run-if-empty node tools/check-dashes.mjs --files
          fi
          node tools/check-dashes.mjs --check-baseline
          if [ "$EVENT_NAME" = pull_request ] && [ "$PR_AUTHOR_TYPE" != Bot ]; then
            node tools/check-dashes.mjs --text "$PR_TITLE $PR_BODY"
          fi

      - name: Skill and Agent Frontmatter
        if: ${{ !cancelled() }}
        run: node tools/check-frontmatter.mjs

      - name: Root Allowlist
        if: ${{ !cancelled() }}
        run: node tools/check-root-allowlist.mjs
