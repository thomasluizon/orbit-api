name: Guards

# Cheap repo-hygiene gates vendored from orbit-ui-mobile, one job each. They
# hold for every tool because CI is the one layer nothing bypasses.
#
# Dash Ban (REBUILD.md 6.1.1): the old session-only hook matched /Email/ and
# ResendEmailService.cs only, so 71 tracked .cs files carried dashes ungated (a
# confirmed audit gap).
#
# Skill and Agent Frontmatter (REBUILD.md section 14, item 1): an unquoted YAML
# value containing ": " drops the skill or agent silently, which is how this
# repo's security-reviewer stopped loading.
#
# Harness Lockstep (ORB-105): the six load-bearing review and security harness
# twins must stay aligned with orbit-ui-mobile.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dashes:
    name: Dash Ban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changed files carry no new dashes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -z \
            | xargs -0 --no-run-if-empty node tools/check-dashes.mjs --files
      - name: Baseline only shrinks
        run: node tools/check-dashes.mjs --check-baseline
      - name: PR title and body carry no dashes
        # Human-authored prose only. A bot PR body is machine-copied upstream text
        # (Dependabot quotes the dependency's own changelog verbatim), which Orbit
        # neither wrote nor can edit, and which Dependabot regenerates on every
        # rebase. The file-level dash check above still runs on bot PRs, because
        # the files they change ARE Orbit's. See orbit-api#425, where a Hangfire
        # release note's en dashes blocked a security-relevant NuGet bump.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/check-dashes.mjs --text "$PR_TITLE $PR_BODY"

  frontmatter:
    name: Skill and Agent Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-frontmatter.mjs

  lockstep:
    name: Harness Lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a lockstep change
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
            | grep -Eq '^(\.claude/skills/pr-review/(SKILL\.md|rubric\.md)|\.claude/skills/_shared/verification-protocol\.md|\.claude/agents/(contract-aligner|security-reviewer)\.md|\.claude/skills/second-opinion/second-opinion\.mjs|\.github/workflows/guards\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out orbit-ui-mobile at main
        if: steps.scope.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: thomasluizon/orbit-ui-mobile
          ref: main
          path: orbit-ui-mobile
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Six harness twins stay in lockstep
        if: steps.scope.outputs.changed == 'true'
        run: node orbit-ui-mobile/tools/check-lockstep.mjs --ui-root "$GITHUB_WORKSPACE/orbit-ui-mobile" --api-root "$GITHUB_WORKSPACE"
