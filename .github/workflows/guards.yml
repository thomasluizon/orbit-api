name: Guards

# These repository gates apply to every contributor through CI. Each step runs even when an
# earlier one fails, so one run reports every broken gate. The OpenAPI breaking-change gate, the
# dependency review and the Render infrastructure validation run on pull requests only, and only
# when the pull request changes an input of the step (.github/scripts/changed-inputs.sh).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      # fetch-depth 0 fetches every branch, so origin/<base> is present for the diff-based steps.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select the inputs that changed
        id: inputs
        run: bash .github/scripts/changed-inputs.sh openapi deps infra

      # Pull request runs read the binary that main saves and never save one.
      - name: Restore actionlint
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p ~/.cache/actionlint
          tar -xzf "$archive" -C ~/.cache/actionlint actionlint

      - name: Workflow Syntax
        if: ${{ !cancelled() }}
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency documents queue, which actionlint does not recognize.
        run: ~/.cache/actionlint/actionlint -color -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'

      - name: Dash Ban
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -z \
              | xargs -0 --no-run-if-empty node tools/check-dashes.mjs --files
          fi

      - name: Tool tests
        if: ${{ !cancelled() }}
        run: node --test tools/__tests__/*.test.mjs

      - name: API release admission tests
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/release-admission.test.mjs .github/scripts/stripe-webhook-version.test.mjs

      - name: CI input selection tests
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/changed-inputs.test.mjs

      - name: OpenAPI publication guard tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_openapi_artifacts.py'

      - name: Ban permissive CORS
        if: ${{ !cancelled() }}
        run: |
          violations=$(grep -rnE '\.AllowAnyHeader\(|\.AllowAnyMethod\(' src --include='*.cs' || true)
          if [ -n "$violations" ]; then
            echo "::error::CORS must enumerate explicit headers and methods. AllowAnyHeader()/AllowAnyMethod() are banned."
            echo "$violations"
            exit 1
          fi
          echo "OK: no permissive CORS calls."

      - name: Stripe key set only at startup
        if: ${{ !cancelled() }}
        run: |
          violations=$(grep -rnE 'StripeConfiguration\.ApiKey[[:space:]]*=' src --include='*.cs' | grep -v 'ServiceCollectionExtensions.Infrastructure.cs' || true)
          if [ -n "$violations" ]; then
            echo "::error::StripeConfiguration.ApiKey may only be assigned once at startup in ServiceCollectionExtensions.Infrastructure.cs. Never set it per-request."
            echo "$violations"
            exit 1
          fi
          echo "OK: StripeConfiguration.ApiKey assigned only at startup."

      - name: Ban TODO/FIXME/HACK markers
        if: ${{ !cancelled() }}
        run: |
          violations=$(grep -rnE '\b(TODO|FIXME|HACK)\b' src --include='*.cs' | grep -v '/Migrations/' || true)
          if [ -n "$violations" ]; then
            echo "::error::TODO/FIXME/HACK markers are banned in committed source. Resolve the work or track it in a GitHub issue."
            echo "$violations"
            exit 1
          fi
          echo "OK: no TODO/FIXME/HACK markers in source."

      # The same oasdiff release as the oasdiff-action image, pinned by its published checksum.
      - name: Install oasdiff
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.inputs.outputs.openapi == 'true' }}
        env:
          OASDIFF_VERSION: 1.36.0
          OASDIFF_SHA256: dba65661f6d0f178a3e4884c309f19527a849388bb9df0e81545db76dbb697d6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oasdiff.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "$OASDIFF_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"

      # openapi_artifacts.py validates every published stream and plans one comparison for each
      # stream with a prior same-stream artifact; the v1 document is compared on its own path.
      - name: OpenAPI Breaking-Change Gate
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.inputs.outputs.openapi == 'true' }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          plan=$(python3 .github/scripts/openapi_artifacts.py plan --base "$BASE_REF")
          git cat-file -e "$BASE_REF:src/Orbit.Api/openapi.json"
          comparisons=$(jq -r --arg base "$BASE_REF:src/Orbit.Api/openapi.json" \
            '[{id: "orbit-http-v1-r1", base: $base, revision: "src/Orbit.Api/openapi.json"}] + .include | .[] | [.id, .base, .revision] | @tsv' <<< "$plan")
          failed=0
          while IFS=$'\t' read -r id base revision; do
            echo "::group::$id: $base against $revision"
            status=0
            oasdiff breaking "$base" "$revision" --allow-external-refs=false --composed=false --fail-on ERR || status=$?
            if [ "$status" -eq 1 ]; then
              oasdiff breaking "$base" "$revision" --allow-external-refs=false --composed=false --format githubactions --template= || true
            fi
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::$id: oasdiff exited $status (1 is a breaking change at level ERR)"
              failed=1
            fi
          done <<< "$comparisons"
          exit "$failed"

      - name: Dependency Review
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.inputs.outputs.deps == 'true' }}
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Setup Node for Render infrastructure
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.inputs.outputs.infra == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Setup Terraform
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.inputs.outputs.infra == 'true' }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.4

      - name: Validate Render infrastructure
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.inputs.outputs.infra == 'true' }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
          npm ci --prefix infra --ignore-scripts
          npm test --prefix infra
          node --test .github/scripts/staging-reseed.test.mjs .github/scripts/staging-reseed-image.test.mjs
          bash .github/scripts/test-postgres-access.sh

      - name: Save actionlint
        if: github.event_name != 'pull_request' && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}
