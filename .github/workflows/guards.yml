name: Guards

# These repository gates apply to every contributor through CI.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  timeless:
    name: Timeless Text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check changed text
        if: github.event_name == 'pull_request'
        run: node tools/check-timeless.mjs --base origin/${{ github.base_ref }}
      - name: Check tracked text
        if: github.event_name == 'push'
        run: node tools/check-timeless.mjs --all

  dashes:
    name: Dash Ban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changed files carry no new dashes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -z \
            | xargs -0 --no-run-if-empty node tools/check-dashes.mjs --files
      - name: Baseline only shrinks
        run: node tools/check-dashes.mjs --check-baseline
      - name: PR title and body carry no dashes
        # Bot PR bodies quote upstream text that Orbit cannot edit.
        # The file-level dash check still covers bot changes.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/check-dashes.mjs --text "$PR_TITLE $PR_BODY"

  frontmatter:
    name: Skill and Agent Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-frontmatter.mjs

  root-allowlist:
    name: Root Allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-root-allowlist.mjs
