name: Release API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Render environment to release
        type: choice
        options:
          - production
          - staging
        required: true
      branch:
        description: Git branch to release
        type: string
        required: true
        default: main
      sha:
        description: Full commit SHA (required for staging; production defaults to the dispatch commit)
        type: string
        required: false
      force_unstaged:
        description: Release production without a matching healthy staging commit
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: api-release-${{ inputs.environment }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release selection
        id: selection
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Dispatch the release workflow from main'
            exit 1
          fi
          if [ "$RELEASE_BRANCH" = '' ] || [ "$RELEASE_BRANCH" != "${RELEASE_BRANCH#refs/}" ]; then
            echo '::error::Select a branch name'
            exit 1
          fi
          if [ "$RELEASE_ENVIRONMENT" = production ] && [ "$RELEASE_BRANCH" != main ]; then
            echo '::error::Production releases require branch main'
            exit 1
          fi
          git check-ref-format "refs/heads/$RELEASE_BRANCH"
          if [ "$RELEASE_ENVIRONMENT" = production ] && [ -z "$RELEASE_SHA" ]; then
            RELEASE_SHA="$DISPATCH_SHA"
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Select a full 40-character commit SHA; staging requires an explicit SHA'
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit
        id: commit
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_SHA: ${{ steps.selection.outputs.sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ "$sha" != "$RELEASE_SHA" ]; then
            echo '::error::Checkout does not match the selected release SHA'
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$RELEASE_BRANCH"; then
            echo "::error::The selected release SHA is not reachable from $RELEASE_BRANCH"
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  production:
    if: inputs.environment == 'production'
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 170
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_PRODUCTION_SERVICE_ID }}
      COMMIT_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require healthy staging commit
        env:
          FORCE_UNSTAGED: ${{ inputs.force_unstaged }}
        run: |
          set -euo pipefail
          {
            echo '## Production staging admission'
            echo "Selected SHA: $COMMIT_SHA"
            echo "force_unstaged: $FORCE_UNSTAGED"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FORCE_UNSTAGED" = true ]; then
            echo "::notice::Operator override force_unstaged permits production release of $COMMIT_SHA without staging admission"
            exit 0
          fi
          health=$(curl --fail-with-body --silent --show-error --max-time 30 \
            'https://api-staging.useorbit.org/health')
          if ! jq -e --arg sha "$COMMIT_SHA" '.status == "Healthy" and .commit == $sha' <<< "$health" > /dev/null; then
            echo "::error::Staging must serve $COMMIT_SHA with status Healthy before production release; force_unstaged is the explicit override"
            exit 1
          fi
          echo "Staging served $COMMIT_SHA with status Healthy" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger and monitor Render deploy
        id: render
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          source .github/scripts/render-release.sh
          step_started=$(jq -n 'now')
          payload=$(jq -cn --arg sha "$COMMIT_SHA" '{commitId: $sha}')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(render_start_deploy "$payload" "$response_file" "$step_started")
          case "$http_status" in
            201) deploy_id=$(jq -er '.id' < "$response_file") ;;
            202)
              # Render queues a request behind a running deploy and returns no deploy, so nothing
              # identifies which later deploy is this request's. Releases are serialized, so fail closed.
              echo "::error::Render queued the deploy of $COMMIT_SHA behind another deploy and returned no deploy ID; rerun the release once the service is idle"
              exit 1 ;;
            *)
              echo "::error::Render answered HTTP $http_status to the deploy request"
              exit 1 ;;
          esac
          log_url="https://dashboard.render.com/web/$RENDER_SERVICE_ID/deploys/$deploy_id"
          echo "log_url=$log_url" >> "$GITHUB_OUTPUT"
          echo "Render deploy: $log_url"

          for attempt in {1..640}; do
            response=$(render_request GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")
            status=$(jq -er '.status' <<< "$response")
            echo "Render deploy status: $status (poll $attempt)"
            case "$status" in
              live) exit 0 ;;
              build_failed|pre_deploy_failed|update_failed|canceled|deactivated)
                echo "::error::Render deploy $deploy_id ended with $status. Logs: $log_url"
                exit 1 ;;
              created|queued|build_in_progress|pre_deploy_in_progress|update_in_progress)
                sleep 15 ;;
              *)
                echo "::error::Render deploy $deploy_id returned unknown status $status. Logs: $log_url"
                exit 1 ;;
            esac
          done
          echo "::error::Render deploy $deploy_id timed out. Logs: $log_url"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify API health and live commit
        run: |
          set -euo pipefail
          node tools/verify-release-health.mjs 'https://api.useorbit.org/health'
          source .github/scripts/render-release.sh
          live_commit=$(render_request GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" --get \
            --data-urlencode 'status=live' --data-urlencode 'limit=1' |
            jq -er '.[0].deploy.commit.id')
          if [ "$live_commit" != "$COMMIT_SHA" ]; then
            echo "::error::Render now serves $live_commit, not the released $COMMIT_SHA"
            exit 1
          fi

      - name: Record deployment
        env:
          RENDER_LOG_URL: ${{ steps.render.outputs.log_url }}
        run: |
          set -euo pipefail
          deployment=$(jq -cn --arg ref "$COMMIT_SHA" \
            '{ref: $ref, environment: "production", auto_merge: false, required_contexts: []}')
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            --input - --jq '.id' <<< "$deployment")
          status=$(jq -cn --arg log_url "$RENDER_LOG_URL" \
            '{state: "success", environment: "production", log_url: $log_url, environment_url: "https://api.useorbit.org"}')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            --input - <<< "$status"

      - name: Summarize release
        run: |
          set -euo pipefail
          {
            echo '## API production release'
            echo "Deployed SHA: $COMMIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    if: inputs.environment == 'staging'
    needs: prepare
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      deployments: write
      packages: write
    timeout-minutes: 170
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
      COMMIT_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: release-source

      - name: Verify image source
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ "$(git -C release-source rev-parse HEAD)" != "$COMMIT_SHA" ]; then
            echo '::error::Image checkout does not match the selected release SHA'
            exit 1
          fi
          if ! git -C release-source merge-base --is-ancestor "$COMMIT_SHA" "refs/remotes/origin/$RELEASE_BRANCH"; then
            echo "::error::The selected release SHA is not reachable from $RELEASE_BRANCH"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push staging image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./release-source
          file: ./release-source/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/thomasluizon/orbit-api:${{ needs.prepare.outputs.sha }}
          build-args: API_COMMIT_SHA=${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/thomasluizon/orbit-api
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Image build did not return a sha256 digest'
            exit 1
          fi
          echo "Pushed ghcr.io/thomasluizon/orbit-api@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger and monitor Render deploy
        id: render
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          source .github/scripts/render-release.sh
          image_url="ghcr.io/thomasluizon/orbit-api@$IMAGE_DIGEST"
          payload=$(jq -cn --arg image "$image_url" '{imageUrl: $image}')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          if ! http_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' --data "$payload"); then
            echo "::error::Render deploy acceptance is unknown for $image_url; check service deploys before rerunning"
            exit 1
          fi
          case "$http_status" in
            201) ;;
            202)
              echo '::error::Render queued the deploy without a deploy ID; rerun once the service is idle'
              exit 1 ;;
            400)
              echo '::error::Render rejected imageUrl. If orbit-api-staging is not image-backed yet, the coordinator must switch its source to the published GHCR image through the Render API, refresh Terraform state, then rerun'
              exit 1 ;;
            *)
              echo "::error::Render answered HTTP $http_status; check service deploys before rerunning"
              exit 1 ;;
          esac
          if ! deploy_id=$(jq -er --arg image "$image_url" \
            'select(.image.ref == $image) | .id | select(type == "string" and length > 0)' < "$response_file"); then
            echo '::error::Render HTTP 201 did not identify a deploy of the requested image; check service deploys before rerunning'
            exit 1
          fi
          log_url="https://dashboard.render.com/web/$RENDER_SERVICE_ID/deploys/$deploy_id"
          echo "log_url=$log_url" >> "$GITHUB_OUTPUT"
          echo "Render deploy: $log_url"

          for attempt in {1..640}; do
            response=$(render_request GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")
            status=$(jq -er '.status' <<< "$response")
            echo "Render deploy status: $status (poll $attempt)"
            case "$status" in
              live) exit 0 ;;
              build_failed|pre_deploy_failed|update_failed|canceled|deactivated)
                echo "::error::Render deploy $deploy_id ended with $status. Logs: $log_url"
                exit 1 ;;
              created|queued|build_in_progress|pre_deploy_in_progress|update_in_progress)
                sleep 15 ;;
              *)
                echo "::error::Render deploy $deploy_id returned unknown status $status. Logs: $log_url"
                exit 1 ;;
            esac
          done
          echo "::error::Render deploy $deploy_id timed out. Logs: $log_url"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify staging health and live commit
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          node tools/verify-release-health.mjs 'https://api-staging.useorbit.org/health'
          source .github/scripts/render-release.sh
          live_commit=$(render_request GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" --get \
            --data-urlencode 'status=live' --data-urlencode 'limit=1' |
            jq -er '.[0].deploy.image.ref')
          if [ "$live_commit" != "ghcr.io/thomasluizon/orbit-api@$IMAGE_DIGEST" ]; then
            echo "::error::Render now serves $live_commit, not the released image digest $IMAGE_DIGEST"
            exit 1
          fi

      - name: Record deployment
        env:
          RENDER_LOG_URL: ${{ steps.render.outputs.log_url }}
        run: |
          set -euo pipefail
          deployment=$(jq -cn --arg ref "$COMMIT_SHA" \
            '{ref: $ref, environment: "staging", auto_merge: false, required_contexts: []}')
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            --input - --jq '.id' <<< "$deployment")
          status=$(jq -cn --arg log_url "$RENDER_LOG_URL" \
            '{state: "success", environment: "staging", log_url: $log_url, environment_url: "https://api-staging.useorbit.org"}')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            --input - <<< "$status"

      - name: Summarize release
        run: |
          set -euo pipefail
          {
            echo '## API staging release'
            echo "Deployed SHA: $COMMIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
