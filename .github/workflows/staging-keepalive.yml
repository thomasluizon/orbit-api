name: Staging keepalive

on:
  schedule:
    # Sao Paulo is UTC-3 year round. 11:00-02:55 UTC is 08:00-23:55 local.
    - cron: '*/5 11-23 * * *'
    - cron: '*/5 0-2 * * *'

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check staging health
        run: curl --fail --silent --show-error --max-time 90 https://api-staging.useorbit.org/health > /dev/null
