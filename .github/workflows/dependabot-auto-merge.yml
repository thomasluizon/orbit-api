name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # github-actions[bot] is a different actor than the dependabot[bot] author, so
      # GitHub accepts this approval where a self-approval would be rejected. It is not a
      # merge gate: `main` requires zero approving reviews in both repositories, because
      # no identity produces approving reviews now that the CI reviewer is deleted, and a
      # count of 1 with no producer would turn every merge into an admin merge.
      - name: Approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge only the safe lanes (GitHub Actions + NuGet, patch/minor). npm is left
      # for a human review — the mobile workspace is Expo-SDK-pinned. Build + Unit Tests
      # still gate the merge.
      - name: Enable auto-merge for safe lanes
        if: ${{ steps.meta.outputs.package-ecosystem != 'npm' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor') }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
