# PULLFROG ACTION - DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Provider keys moved from the step to the job so both the primary and the
    # fallback step below read the same list from one place.
    env:
      # add at least one provider API key
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
      # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # AWS_REGION: us-east-1
      # BEDROCK_MODEL_ID: <bedrock-model-id>

      # for Google Vertex AI (https://docs.pullfrog.com/vertex)
      # VERTEX_SERVICE_ACCOUNT_JSON: >-
      #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
      # GOOGLE_CLOUD_PROJECT: my-project
      # VERTEX_LOCATION: global
      # VERTEX_MODEL_ID: <vertex-model-id>

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Codex is the reviewer: the stored Codex credential on the default opencode harness, which
      # keeps the reviewfrog specialist sub-agent. `model` pins openai/gpt-6.1-sol, which no curated
      # Pullfrog alias resolves to yet, so it passes through as a raw specifier and overrides the
      # repository config. With no alias there is no effort rung, so no effort is sent and the
      # model runs at OpenAI's documented default, medium. The step pins a release commit because
      # a moving tag is an unpinned dependency. Reviews stay on Codex: a failed Codex step fails the
      # job, and no other engine reviews in its place.
      - name: Run agent
        id: codex
        uses: pullfrog/pullfrog@25a837a2b078177c3acdce790506d1fd1acedd82 # v0, release 0.1.102
        with:
          prompt: ${{ inputs.prompt }}
          model: openai/gpt-6.1-sol
