# PULLFROG ACTION - DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Provider keys moved from the step to the job so both the primary and the
    # fallback step below read the same list from one place.
    env:
      # add at least one provider API key
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
      # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # AWS_REGION: us-east-1
      # BEDROCK_MODEL_ID: <bedrock-model-id>

      # for Google Vertex AI (https://docs.pullfrog.com/vertex)
      # VERTEX_SERVICE_ACCOUNT_JSON: >-
      #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
      # GOOGLE_CLOUD_PROJECT: my-project
      # VERTEX_LOCATION: global
      # VERTEX_MODEL_ID: <vertex-model-id>

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Claude is the reviewer: `model` pins anthropic/claude-opus-5-5 and `effort` pins xhigh, both
      # declared inputs of the pinned release's action.yml. The specifier is not a curated slug, so
      # it passes through raw and overrides the repository config. It is the target of the curated
      # anthropic/claude-opus alias, so the release still finds that alias's five-rung effort ladder
      # and lands xhigh on its own rung. An Anthropic model with CLAUDE_CODE_OAUTH_TOKEN present runs
      # on the claude-code harness. That harness uses the subscription token before ANTHROPIC_API_KEY,
      # and this repository stores no ANTHROPIC_API_KEY. The release never moves a run to a different model:
      # a failed Claude step fails the job, and no other engine reviews in its place. The step pins a
      # release commit because a moving tag is an unpinned dependency.
      - name: Run agent
        id: claude
        uses: pullfrog/pullfrog@0613df0079954102a9727e833b1e4da229b8f440 # v0, release 0.1.122
        with:
          prompt: ${{ inputs.prompt }}
          model: anthropic/claude-opus-5-5
          effort: xhigh
