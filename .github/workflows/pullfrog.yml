# PULLFROG ACTION - DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_PROMPT_CACHE_TTL: 5m
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # This step runs the review on the CLAUDE_CODE_OAUTH_TOKEN subscription.
      # It pins a release commit, because a moving tag is an unpinned dependency.
      - name: Run agent
        id: claude
        uses: pullfrog/pullfrog@ef3a939a663d6eb5701ecbcbb824621076cf10e5 # v0, release 0.1.140
        with:
          prompt: ${{ inputs.prompt }}
          model: anthropic/claude-opus-5-5
          effort: xhigh
