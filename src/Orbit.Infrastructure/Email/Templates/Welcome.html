<h1 class="orbit-fg-1" style="margin: 0 0 12px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 600; line-height: 1.3; color: #1A1A1D;">{{heading}}</h1>
<p class="orbit-fg-2" style="margin: 0; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #424247;">{{intro}}</p>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
        <td style="padding: 28px 0;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                    <td height="1" class="orbit-rule" bgcolor="#E8E8E9" style="height: 1px; line-height: 1px; font-size: 1px; background-color: #E8E8E9;">&nbsp;</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
<p class="orbit-fg-1" style="margin: 0 0 16px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; line-height: 1.4; color: #1A1A1D;">{{featuresTitle}}</p>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
        <td valign="top" width="28" class="orbit-fg-3" style="padding: 0 0 12px; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.6; color: #68686D;">1</td>
        <td class="orbit-fg-2" style="padding: 0 0 12px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #424247;">{{feature1}}</td>
    </tr>
    <tr>
        <td valign="top" width="28" class="orbit-fg-3" style="padding: 0 0 12px; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.6; color: #68686D;">2</td>
        <td class="orbit-fg-2" style="padding: 0 0 12px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #424247;">{{feature2}}</td>
    </tr>
    <tr>
        <td valign="top" width="28" class="orbit-fg-3" style="padding: 0; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.6; color: #68686D;">3</td>
        <td class="orbit-fg-2" style="padding: 0; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #424247;">{{feature3}}</td>
    </tr>
</table>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
        <td align="center" style="padding: 32px 0 0;">
            <a href="{{ctaUrl}}" style="display: inline-block; background-color: #C4530F; color: #FFFFFF; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; text-decoration: none; padding: 14px 32px; border-radius: 999px;">{{cta}}</a>
        </td>
    </tr>
</table>
