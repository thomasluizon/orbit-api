<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title translate="no">Orbit</title>
    <style>
        @media (prefers-color-scheme: dark) {
            body, .orbit-canvas { background-color: #09090B !important; }
            .orbit-card { background-color: #131315 !important; border-color: #262628 !important; }
            .orbit-well { background-color: #1C1C1E !important; }
            .orbit-rule { background-color: #262628 !important; }
            .orbit-fg-1 { color: #F4F4F6 !important; }
            .orbit-fg-2 { color: #C9C9CC !important; }
            .orbit-fg-3 { color: #8F8F93 !important; }
            .orbit-accent-text { color: #E16D33 !important; }
        }
        @media only screen and (max-width: 600px) {
            .orbit-card { padding: 28px 20px !important; }
        }
    </style>
</head>
<body class="orbit-canvas" style="margin: 0; padding: 0; background-color: #FAFAFA;">
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">{{preheader}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" class="orbit-canvas" style="background-color: #FAFAFA;">
        <tr>
            <td align="center">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td align="center" style="padding: 48px 24px 32px;">
                            <img src="{{logoUrl}}" width="48" height="48" alt="Orbit" style="display: block; border: 0;">
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td align="center" style="padding: 0 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td class="orbit-card" bgcolor="#FFFFFF" style="background-color: #FFFFFF; border: 1px solid #E8E8E9; border-radius: 20px; padding: 40px 32px;">
{{content}}
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 32px 24px 56px;">
                            <p class="orbit-fg-3" style="margin: 0; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #68686D;">{{footer}}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
