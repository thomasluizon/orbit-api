<h1 class="orbit-fg-1" style="margin: 0 0 12px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 600; line-height: 1.3; color: #1A1A1D;">{{heading}}</h1>
<p class="orbit-fg-2" style="margin: 0 0 28px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #424247;">{{intro}}</p>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
        <td align="center" style="padding: 0 0 24px;">
            <a href="{{confirmUrl}}" style="display: inline-block; background-color: #C4530F; color: #FFFFFF; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; text-decoration: none; padding: 14px 32px; border-radius: 999px;">{{cta}}</a>
        </td>
    </tr>
</table>
<p class="orbit-fg-3" style="margin: 0; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #68686D;">{{warning}}</p>
