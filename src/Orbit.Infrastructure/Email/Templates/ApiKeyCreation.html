<h1 class="orbit-fg-1" style="margin: 0 0 12px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 600; line-height: 1.3; color: #1A1A1D;">{{heading}}</h1>
<p class="orbit-fg-2" style="margin: 0 0 20px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #424247;">{{intro}}</p>
<p class="orbit-fg-2" style="margin: 0 0 16px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; line-height: 1.6; color: #424247;">{{codeLabel}}</p>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
        <td align="center" class="orbit-well" bgcolor="#F5F5F6" style="background-color: #F5F5F6; border-radius: 12px; padding: 24px 16px;">
            <span class="orbit-fg-1" style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 32px; font-weight: 500; letter-spacing: 8px; color: #1A1A1D; white-space: nowrap;">{{code}}</span>
        </td>
    </tr>
</table>
<p class="orbit-fg-3" style="margin: 24px 0 0; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #68686D;">{{warning}}</p>
