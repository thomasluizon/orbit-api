<h1 class="orbit-fg-1" style="margin: 0 0 24px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3; color: #1A1A1D;">{{heading}}</h1>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
        <td class="orbit-fg-3" style="padding: 0 0 4px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; color: #68686D;">{{fromLabel}}</td>
    </tr>
    <tr>
        <td class="orbit-fg-1" style="padding: 0 0 16px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #1A1A1D;">{{fromName}} &lt;{{fromEmail}}&gt;</td>
    </tr>
    <tr>
        <td class="orbit-fg-3" style="padding: 0 0 4px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; color: #68686D;">{{subjectLabel}}</td>
    </tr>
    <tr>
        <td class="orbit-fg-1" style="padding: 0 0 20px; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #1A1A1D;">{{subject}}</td>
    </tr>
    <tr>
        <td height="1" class="orbit-rule" bgcolor="#E8E8E9" style="height: 1px; line-height: 1px; font-size: 1px; background-color: #E8E8E9;">&nbsp;</td>
    </tr>
    <tr>
        <td class="orbit-fg-2" style="padding: 20px 0 0; font-family: 'Geist Sans', Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #424247;">{{message}}</td>
    </tr>
</table>
